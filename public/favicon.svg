<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Background linear gradient -->
    <linearGradient id="bgGrad" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#143e64" />
      <stop offset="45%" stop-color="#0a1d30" />
      <stop offset="100%" stop-color="#050e18" />
    </linearGradient>

    <!-- Border highlight gradient -->
    <linearGradient id="borderGrad" x1="10" y1="4" x2="54" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="35%" stop-color="#7dd3fc" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Inner glow effect -->
    <radialGradient id="innerGlow" cx="30%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle drop shadow / outer glow -->
    <filter id="shadowGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0284c7" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Pebble shape background & border matching border-radius: 28% 72% 31% 69% / 35% 36% 64% 65% -->
  <path
    d="M 19.68 4.00 A 40.32 20.16 0 0 1 60.00 24.16 A 17.36 35.84 0 0 1 42.64 60.00 A 38.64 36.40 0 0 1 4.00 23.60 A 15.68 19.60 0 0 1 19.68 4.00 Z"
    fill="url(#bgGrad)"
    stroke="url(#borderGrad)"
    stroke-width="2.5"
    filter="url(#shadowGlow)"
  />

  <!-- Subtle inner radial glow overlay -->
  <path
    d="M 19.68 4.00 A 40.32 20.16 0 0 1 60.00 24.16 A 17.36 35.84 0 0 1 42.64 60.00 A 38.64 36.40 0 0 1 4.00 23.60 A 15.68 19.60 0 0 1 19.68 4.00 Z"
    fill="url(#innerGlow)"
  />

  <!-- High-contrast crisp white 'B' letter mark -->
  <text
    x="31.5"
    y="39"
    text-anchor="middle"
    fill="#ffffff"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-weight="800"
    font-size="27"
    letter-spacing="-0.02em"
  >B</text>
</svg>
